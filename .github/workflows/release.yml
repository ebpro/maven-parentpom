name: Release to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.1.20)'
        required: true

permissions:
  contents: read
  packages: write

env:
  CI: true

jobs:
  release:
    name: Build, Sign & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for changelog generation

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup GPG
        uses: olafbergerson/gpg-maven-action@v2
        with:
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          gpg-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-key-armored: true

      - name: Display build environment
        run: |
          java -version
          mvn --version

      - name: Build & Verify (with SBOM + signing)
        run: |
          mvn -B clean verify \
            -P gpgsigning \
            -DskipTests=false \
            -Dmaven.javadoc.skip=false

      - name: Publish to Maven Central (Central Portal)
        env:
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          mvn -B central-publishing:publish \
            -Dcentral.publishing.username=$CENTRAL_TOKEN \
            -Dcentral.publishing.password=$CENTRAL_TOKEN

      - name: Upload SBOM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.ref_name }}
          path: |
            target/bom.json
            target/bom.xml

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: target/*.jar
