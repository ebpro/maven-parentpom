name: Release

on:
  push:
    tags:
      - 'v[0-9]+.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.20)'
        required: true
        type: string
      publish-central:
        description: 'Also publish to Maven Central Portal'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CI: true
  # ci-utils-java/ci-settings.xml:
  #  - nexus-proxy profile mirrors central through Nexus when MAVEN_PROXY_URL is set
  #    (server auth via NEXUS_USERNAME / NEXUS_PASSWORD)
  #  - github profile builds its repository URL from GITHUBORG
  MAVEN_PROXY_URL: ${{ secrets.MAVEN_PROXY_URL }}
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
  GITHUBORG: ${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Tier 1: GitHub Packages (always)
  # ─────────────────────────────────────────────────────────────
  release-github-packages:
    name: Release → GitHub Packages
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Determine release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag-triggered: extract version from tag (v0.1.20 -> 0.1.20)
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Manual dispatch: use input
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup GPG
        uses: olafbergerson/gpg-maven-action@v2
        with:
          gpg-passphrase: ${{ secrets.SIGN_KEY_PASS }}
          gpg-key: ${{ secrets.SIGN_KEY }}
          gpg-key-armored: true

      - name: Set release version (strip -SNAPSHOT)
        run: |
          ./mvnw -B --settings ci-utils-java/ci-settings.xml versions:set \
            -DnewVersion="${{ steps.version.outputs.version }}" \
            -DgenerateBackupPoms=false

      - name: Build + Sign + Deploy to GitHub Packages
        env:
          GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
        run: |
          ./mvnw -B --settings ci-utils-java/ci-settings.xml clean deploy \
            -P release \
            -DskipTests

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}

      - name: Bump to next SNAPSHOT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT="${{ steps.version.outputs.version }}"
          # Increment patch version: 0.1.20 -> 0.1.21-SNAPSHOT
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"

          ./mvnw -B --settings ci-utils-java/ci-settings.xml versions:set \
            -DnewVersion="${NEXT_VERSION}" \
            -DgenerateBackupPoms=false

          git add pom.xml
          git commit -m "chore(release): bump to ${NEXT_VERSION} [ci skip]"
          git push origin HEAD:develop

      - name: Upload SBOM artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ steps.version.outputs.tag }}
          path: |
            target/bom.json
            target/bom.xml

  # ─────────────────────────────────────────────────────────────
  # Tier 2: Maven Central Portal (opt-in)
  # ─────────────────────────────────────────────────────────────
  release-maven-central:
    name: Release → Maven Central
    needs: release-github-packages
    runs-on: [self-hosted, linux, ebpro-org, x64]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish-central == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup GPG
        uses: olafbergerson/gpg-maven-action@v2
        with:
          gpg-passphrase: ${{ secrets.SIGN_KEY_PASS }}
          gpg-key: ${{ secrets.SIGN_KEY }}
          gpg-key-armored: true

      - name: Set release version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          ./mvnw -B --settings ci-utils-java/ci-settings.xml versions:set \
            -DnewVersion="${VERSION}" \
            -DgenerateBackupPoms=false

      - name: Build (sources + javadoc + sign + SBOM)
        run: |
          ./mvnw -B --settings ci-utils-java/ci-settings.xml clean verify \
            -P release \
            -DskipTests

      - name: Publish to Maven Central Portal
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        run: |
          ./mvnw -B --settings ci-utils-java/ci-settings.xml central-publishing:publish \
            -Dcentral.publishing.username="${CENTRAL_PORTAL_USERNAME}" \
            -Dcentral.publishing.password="${CENTRAL_PORTAL_TOKEN}" \
            -Dcentral.publishing.defaultDeploymentRepository=central-portal-ebpro

      - name: Upload SBOM artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-central-${{ github.event.inputs.version }}
          path: |
            target/bom.json
            target/bom.xml

  # ─────────────────────────────────────────────────────────────
  # Validation: verify artifacts are resolvable
  # ─────────────────────────────────────────────────────────────
  validate:
    name: Validate published artifacts
    needs: [release-github-packages]
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify artifact is resolvable from GitHub Packages
        env:
          GITHUBTOKEN: ${{ secrets.GITHUBTOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Fetch the exact POM artifact from GitHub Packages.
          # dependency:get fails if the artifact is not resolvable.
          # Run from a clean temp dir (no local pom.xml on the classpath),
          # but invoke the workspace Maven wrapper and settings via absolute
          # paths so the relative cwd does not break ./mvnw / settings lookup.
          WORKDIR="$(mktemp -d)"
          cd "$WORKDIR"
          "$GITHUB_WORKSPACE/mvnw" -B \
            --settings "$GITHUB_WORKSPACE/ci-utils-java/ci-settings.xml" \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:get \
            -Dartifact=fr.ebruno.maven.poms:maven-parentpom:${VERSION}:pom \
            -DremoteRepositories=github::default::https://maven.pkg.github.com/ebpro/maven-parentpom
          echo "Artifact ${VERSION} is resolvable from GitHub Packages"
