name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group: # run the dependency-review gate in the merge queue
  schedule:
    # Weekly scan (Mondays at 6am UTC)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# All jobs run on self-hosted runners to leverage:
# - Nexus (Maven proxy/cache) — configured via runner env vars / settings.xml
# - Harbor (Docker registry mirror) — configured via runner daemon.json
# This avoids re-downloading artifacts from the internet on every run.
env:
  RUNNER: self-hosted
  MAVEN_PROXY_URL: ${{ secrets.MAVEN_PROXY_URL }}
  NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
  NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

jobs:
  dependency-review:
    name: Dependency Review
    # The dependency-review-action is diff-based: it compares a base ref to a
    # head ref to flag *newly introduced* vulnerable dependencies. GitHub only
    # supplies base/head refs for `pull_request`, `merge_group`, and
    # `pull_request_target` events. On `push`, `schedule`, and
    # `workflow_dispatch` there is no base ref, so the action aborts with:
    #   "Both a base ref and head ref must be provided"
    # Fix: gate this job to the events that actually provide a base/head diff.
    # Full-repo dependency scanning on push/schedule is covered by the
    # OWASP Dependency Check canary job below.
    if: >-
      github.event_name == 'pull_request'
      || github.event_name == 'merge_group'
    runs-on: [self-hosted, linux, ebpro-org]
    steps:
      - uses: actions/checkout@v7

      - name: Review dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # BOMs in <dependencyManagement> with <scope>import</scope> are
          # version-management imports, not real dependencies.
          # The action does not flag them, so no ignore list is needed.

  sbom:
    name: Generate SBOM
    runs-on: [self-hosted, linux, ebpro-org]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate CycloneDX SBOM
        run: ./mvnw -B --settings ci-utils-java/ci-settings.xml org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DoutputFormat=All -DoutputName=bom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            target/bom.json
            target/bom.xml

  dependency-check-canary:
    name: OWASP Dependency Check (canary)
    runs-on: [self-hosted, linux, ebpro-org]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build parent + canary
        run: ./mvnw -B --settings ci-utils-java/ci-settings.xml clean verify -DskipTests --errors
        env:
          MAVEN_OPTS: -Xmx512m

      - name: NVD date
        id: nvd-date
        run: echo "d=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache NVD data
        uses: actions/cache@v6
        with:
          path: /home/runner/.nvd-cache
          key: nvd-${{ steps.nvd-date.outputs.d }}
          restore-keys: |
            nvd-

      - name: Run OWASP Dependency Check on canary
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./mvnw -B --settings ci-utils-java/ci-settings.xml org.owasp:dependency-check-maven:13.0.0:check \
            -f target/it/canary/pom.xml \
            -DnvdApiKey="${NVD_API_KEY}" \
            -DdataDirectory=/home/runner/.nvd-cache \
            -DautoUpdate=true \
            -Dmaven.repo.local=target/local-repo \
            -DfailBuildOnCVSS=9
