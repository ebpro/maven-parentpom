name: Security

on:
  push:
    branches: [ develop, main, master ]
  pull_request:
    branches: [ develop, main, master ]
  schedule:
    # Weekly scan (Mondays at 6am UTC)
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# All jobs run on self-hosted runners to leverage:
# - Nexus (Maven proxy/cache) — configured via runner env vars / settings.xml
# - Harbor (Docker registry mirror) — configured via runner daemon.json
# This avoids re-downloading artifacts from the internet on every run.
env:
  RUNNER: self-hosted

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # BOMs in <dependencyManagement> with <scope>import</scope> are
          # version-management imports, not real dependencies.
          # The action does not flag them, so no ignore list is needed.

  sbom:
    name: Generate SBOM
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Generate CycloneDX SBOM
        run: mvn -B cyclonedx:makeBom -DoutputFormat=All -DoutputName=bom

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            target/bom.json
            target/bom.xml

  dependency-check-canary:
    name: OWASP Dependency Check (canary)
    runs-on: [self-hosted, linux, ebpro-org, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build parent + canary
        run: mvn -B clean verify -DskipTests --errors
        env:
          MAVEN_OPTS: -Xmx512m

      - name: Run OWASP Dependency Check on canary
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn -B org.owasp:dependency-check-maven:13.0.0:check \
            -f target/it/canary/pom.xml \
            -DnvdApiKey="${NVD_API_KEY}" \
            -Dmaven.repo.local=target/local-repo \
            -DfailBuildOnCVSS=9
