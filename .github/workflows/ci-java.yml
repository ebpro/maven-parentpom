name: CI Java (Host)

on:
  push:
    branches:
      - "**"
    tags:
      - "!**"
  workflow_dispatch:

jobs:
    build:
        name: build-sonar-site-upload
        uses: ebpro/gh-actions-shared-java/.github/workflows/ci-shareable-maven.yml@develop
        secrets: inherit
        with:
          runs-on: ebpro-org
          jdk-matrix: '[ "25" ]'
          maven-matrix: '[ "3.9.11" ]'
          verify-goal: 'install'
          quality-goal-run: "true"
          deploy-goal-run: "true"
          deploy-goal-develop: '--activate-profiles mavencentral'
          deploy-goal-release: '--activate-profiles mavencentral'
          site-goal-run: "true"
          site-goal-branch: "master"
